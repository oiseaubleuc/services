<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Planet with rings -->
  <ellipse cx="200" cy="200" rx="65" ry="20" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="200" cy="200" r="45" fill="white"/>
  
  <!-- Rocket -->
  <g transform="translate(100, -60)">
    <!-- Rocket body - cylindrical -->
    <rect x="-8" y="-25" width="16" height="35" fill="white" rx="2"/>
    <!-- Rocket nose cone -->
    <polygon points="-8,-25 0,-35 8,-25" fill="white"/>
    <!-- Rocket window -->
    <circle cx="0" cy="-15" r="4" fill="white"/>
    <!-- Rocket fins -->
    <rect x="-12" y="8" width="4" height="12" fill="white" rx="1"/>
    <rect x="8" y="8" width="4" height="12" fill="white" rx="1"/>
    <!-- Motion trail -->
    <path d="M -8 10 Q -12 15, -16 20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6 12 Q -10 17, -14 22" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Two four-pointed stars -->
  <!-- Star above and slightly to the left -->
  <g transform="translate(150, 120)">
    <path d="M 0 -12 L 3 -3 L 12 -3 L 4.5 1.5 L 7.5 10.5 L 0 6 L -7.5 10.5 L -4.5 1.5 L -12 -3 L -3 -3 Z" fill="white"/>
  </g>
  <!-- Star below and slightly to the right -->
  <g transform="translate(250, 280)">
    <path d="M 0 -12 L 3 -3 L 12 -3 L 4.5 1.5 L 7.5 10.5 L 0 6 L -7.5 10.5 L -4.5 1.5 L -12 -3 L -3 -3 Z" fill="white"/>
  </g>
</svg>
